
font=JetBrains Mono NF:size=17
terminal=foot -e
prompt="> "
layer=overlay
lines=15
width=60
dpi-aware=no
inner-pad=10
horizontal-pad=40
vertical-pad=15
match-counter=yes

[colors]
background={{colors.surface.default.hex_stripped}}bb
text={{colors.on_surface.default.hex_stripped}}dd
prompt={{colors.primary.default.hex_stripped}}ff
placeholder={{colors.on_surface_variant.default.hex_stripped}}ff
input={{colors.on_surface.default.hex_stripped}}ff
match={{colors.secondary.default.hex_stripped}}ff
selection={{colors.primary.default.hex_stripped}}87
selection-text={{colors.on_primary.default.hex_stripped}}ff
selection-match={{colors.secondary.default.hex_stripped}}ff
counter={{colors.on_surface_variant.default.hex_stripped}}ff
border={{colors.primary.default.hex_stripped}}77

[border]
radius=10
width=2
